[package]
name = "tusk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.7", optional = true, features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-private"], optional = true }
console_error_panic_hook = "0.1"
leptos = { version = "0.6", features = ["serde"] }
leptos_axum = { version = "0.6", optional = true }
leptos_meta = { version = "0.6" }
leptos_router = { version = "0.6" }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"], optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Storage", "Location", "HtmlInputElement", "FileList", "File", "Blob", "Url", "FormData"] }
gloo-net = { version = "0.6", features = ["http", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
rand = "0.8"
pulldown-cmark = "0.11"
dotenvy = { version = "0.15", optional = true }
cfg-if = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
thiserror = "1.0"
cookie = { version = "0.18", optional = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
time = "0.3"

[features]
hydrate = [
    "leptos/hydrate",
    "leptos_meta/hydrate",
    "leptos_router/hydrate",
]
ssr = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:dotenvy",
    "dep:tracing-subscriber",
    "dep:cookie",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "tusk"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/tailwind.css"
tailwind-input-file = "style/tailwind.css"
tailwind-config-file = "tailwind.config.js"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
